<script type="application/json" id="hubConfig">{"title":"Premier League","tabs":[{"key":"live-lines","label":"Lines","title":"Live Lines","desc":"EPL game cards, live odds and model calls","src":"embed-pl-live-lines.html"},{"key":"transfer-market","label":"Market","title":"Transfer Market","desc":"Player values, transfer targets and hidden gems","src":"embed-pl-transfer-market.html"},{"key":"matchup-lab","label":"Matchups","title":"Matchup Lab","desc":"Selected matchup vs. opponent, position-paired","src":"embed-pl-matchup-lab.html"}]}</script><script>
(function(){
  'use strict';
  const config=JSON.parse(document.getElementById('hubConfig').textContent),frame=document.getElementById('toolFrame'),loader=document.getElementById('frameLoader'),loaderText=document.getElementById('loaderText'),tabs=[...document.querySelectorAll('.hub-tab')],picks=[...document.querySelectorAll('.pick-card')],pickScreen=document.getElementById('hubPick'),activeTitle=document.getElementById('activeTitle'),activeDesc=document.getElementById('activeDesc'),sectionCount=document.getElementById('sectionCount'),hubIdle=document.getElementById('hubIdle'),menu=document.getElementById('mobileMenu'),burger=document.getElementById('hamburgerBtn');
  let active='';
  function choose(key,replace){
    const item=config.tabs.find(t=>t.key===key)||config.tabs[0];if(!item||item.key===active)return;
    active=item.key;const idx=config.tabs.indexOf(item);
    pickScreen.classList.add('hidden');
    hubIdle.style.display='none';
    tabs.forEach(btn=>{const on=btn.dataset.key===active;btn.classList.toggle('active',on);btn.setAttribute('aria-selected',String(on));btn.tabIndex=on?0:-1;});
    const selectedTab=tabs.find(btn=>btn.dataset.key===active);if(selectedTab&&matchMedia('(max-width:700px)').matches)requestAnimationFrame(()=>selectedTab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}));
    activeTitle.textContent=item.title;activeDesc.textContent=item.desc;sectionCount.textContent=String(idx+1).padStart(2,'0')+' / '+String(config.tabs.length).padStart(2,'0');
    loaderText.textContent='Loading '+item.title;loader.classList.remove('hidden');frame.title=item.title+' — Short Open';frame.src=item.src;document.title=item.title+' — '+config.title+' · shortopen';
    const next='#'+item.key;if(location.hash!==next)history[replace?'replaceState':'pushState'](null,'',next);
  }
  tabs.forEach(btn=>{btn.addEventListener('click',()=>choose(btn.dataset.key,false));btn.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();let i=tabs.indexOf(btn);if(e.key==='ArrowRight')i=(i+1)%tabs.length;if(e.key==='ArrowLeft')i=(i-1+tabs.length)%tabs.length;if(e.key==='Home')i=0;if(e.key==='End')i=tabs.length-1;tabs[i].focus();choose(tabs[i].dataset.key,false);});});
  picks.forEach(btn=>btn.addEventListener('click',()=>choose(btn.dataset.key,false)));
  frame.addEventListener('load',()=>loader.classList.add('hidden'));window.addEventListener('hashchange',()=>choose(location.hash.slice(1),true));
  function setMenu(open){menu.classList.toggle('open',open);menu.setAttribute('aria-hidden',String(!open));burger.setAttribute('aria-expanded',String(open));document.body.style.overflow=open?'hidden':'';}
  burger.addEventListener('click',()=>setMenu(!menu.classList.contains('open')));const closeBtn=menu.querySelector('.so-mobile-close,.mobile-close');if(closeBtn)closeBtn.addEventListener('click',()=>setMenu(false));menu.addEventListener('click',e=>{if(e.target.closest('a'))setMenu(false);});
  const initialKey=location.hash.slice(1);
  if(initialKey){choose(initialKey,true);}else{pickScreen.classList.remove('hidden');}
})();
</script>
<script id="so-runtime-performance-core-js-20260811">
(function(){
  'use strict';
  var root=document.documentElement, seen=new WeakSet(), io=null, scrollTimer=0, scrollRAF=0;
  function syncHidden(){root.classList.toggle('so-perf-hidden',document.hidden);}
  document.addEventListener('visibilitychange',syncHidden,{passive:true});
  window.addEventListener('pagehide',function(){root.classList.add('so-perf-hidden');},{passive:true});
  window.addEventListener('pageshow',function(){syncHidden(); scheduleScan();},{passive:true});
  syncHidden();
  if('IntersectionObserver' in window){
    io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){e.target.classList.toggle('so-perf-offscreen-anim',!e.isIntersecting);});
    },{rootMargin:'280px 0px 280px 0px',threshold:0});
  }
  function scanAnimations(){
    if(!document.getAnimations)return;
    var list=document.getAnimations();
    for(var i=0;i<list.length;i++){
      var eff=list[i].effect, t=eff&&eff.target;
      if(!t||t.nodeType!==1||seen.has(t))continue;
      /* Only long-lived ambient loops belong in the offscreen pause system.
         Finite entrance/reveal animations must be allowed to finish once so
         cards and table rows cannot remain frozen in an opacity:0 start state. */
      var timing=(eff&&eff.getTiming)?eff.getTiming():null;
      if(!timing||timing.iterations!==Infinity)continue;
      seen.add(t);t.classList.add('so-perf-anim-target');
      if(io)io.observe(t);
    }
  }
  function scheduleScan(){
    if('requestIdleCallback' in window)requestIdleCallback(scanAnimations,{timeout:650});
    else setTimeout(scanAnimations,120);
  }
  function markScrolling(){
    if(!scrollRAF){
      scrollRAF=requestAnimationFrame(function(){scrollRAF=0;root.classList.add('so-perf-scrolling');});
    }
    clearTimeout(scrollTimer);
    scrollTimer=setTimeout(function(){root.classList.remove('so-perf-scrolling');},115);
  }
  document.addEventListener('scroll',markScrolling,{passive:true,capture:true});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',scheduleScan,{once:true});else scheduleScan();
  window.addEventListener('load',function(){setTimeout(scanAnimations,80);setTimeout(scanAnimations,900);},{once:true,passive:true});
})();
</script>
