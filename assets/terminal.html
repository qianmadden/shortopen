(()=>{const C=JSON.parse(document.getElementById('config').textContent),frame=document.getElementById('frame'),pick=document.getElementById('pick'),grid=document.getElementById('grid'),sw=document.getElementById('switch'),title=document.getElementById('title'),desc=document.getElementById('desc'),idle=document.getElementById('idle'),count=document.getElementById('count'),loader=document.getElementById('loader'),lt=document.getElementById('loadtext');let active='';const icons={market:'<path d="M4 18V9m5 9V5m5 13v-7m5 7V3"/><path d="M3 20h18"/>',optimizer:'<path d="M4 21V14M4 10V3M12 21V12M12 8V3M20 21V16M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/>',projections:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.5h16"/><path d="M4 14.5h16M9.3 9.5v10.5M14.7 9.5v10.5"/><rect x="4" y="4" width="5.3" height="5.5" rx="1" fill="currentColor" fill-opacity=".22" stroke="none"/>',model:'<circle cx="12" cy="12" r="8"/><path d="m15.5 8.5-2.1 4.9-4.9 2.1 2.1-4.9 4.9-2.1Z"/>'};function svg(i,v='0 0 24 24'){return '<svg viewBox="'+v+'" aria-hidden="true">'+icons[i]+'</svg>'}sw.innerHTML=C.tabs.map(t=>'<button class="tab" data-key="'+t.key+'">'+svg(t.icon)+'<span>'+t.title+'</span></button>').join('');grid.innerHTML=C.tabs.map(t=>'<button class="card" data-key="'+t.key+'"><span class="art">'+svg(t.icon)+'</span><span class="body"><span class="name">'+t.title+'</span><span class="desc">'+t.copy+'</span><span class="go">Open →</span></span></button>').join('');const tabs=[...sw.querySelectorAll('.tab')],cards=[...grid.querySelectorAll('.card')];function choose(k,rep){const it=C.tabs.find(x=>x.key===k)||C.tabs[0];if(!it||it.key===active)return;active=it.key;pick.classList.add('hidden');idle.style.display='none';tabs.forEach(b=>b.classList.toggle('active',b.dataset.key===active));title.textContent=it.title;desc.textContent=it.desc;count.textContent=String(C.tabs.indexOf(it)+1).padStart(2,'0')+' / '+String(C.tabs.length).padStart(2,'0');loader.classList.remove('hidden');lt.textContent='Loading '+it.title;frame.src=it.src;frame.title=it.title+' — Short Open';document.title=it.title+' — The Terminal · shortopen';const h='#'+it.key;if(location.hash!==h)history[rep?'replaceState':'pushState'](null,'',h)}tabs.forEach(b=>b.onclick=()=>choose(b.dataset.key,false));cards.forEach(b=>b.onclick=()=>choose(b.dataset.key,false));frame.onload=()=>loader.classList.add('hidden');window.onhashchange=()=>choose(location.hash.slice(1),true);const init=location.hash.slice(1);if(init)choose(init,true);const m=document.getElementById('mobile'),hb=document.getElementById('hamb'),mx=document.getElementById('mx');hb.onclick=()=>m.classList.add('open');mx.onclick=()=>m.classList.remove('open');m.onclick=e=>{if(e.target.closest('a'))m.classList.remove('open')}})();
